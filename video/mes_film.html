<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MES Case Study Film</title>
<!--
  JHS MES v3.0 — 48-second case-study film. Production specification + deterministic renderer.

  HOW THIS FILE WORKS
  • Every visual state is derived from time only: window.seek(t) (t in seconds, 0–48).
    No CSS animations, no timers, no random state, nothing carried between frames.
  • Open normally  → preview player (play/scrub, audio) + the full production spec below the stage.
  • Open with ?render=1 → bare 1920×1080 stage for frame capture (tools/render_video.py).
  • All screenshots are real renders of JHS_MES_v3_0_SIP_Unit-I.xlsx after a full recalculation
    (LibreOffice Calc 24.2). The "empty" and "Chicco" states were produced by changing the real
    input cells and recalculating — no UI state is faked. Keystrokes are an overlay on the real
    cell; the state after Enter is the real recalculated workbook.
  • Positions of highlights, the typed text and the match cut come from anchors measured in the
    rendered PDFs (assets/screenshots/anchors.json), not from guesses.
-->
<style>
@font-face{font-family:'Inter';font-weight:400;font-style:normal;src:url(assets/fonts/Inter-Regular.otf) format('opentype')}
@font-face{font-family:'Inter';font-weight:500;font-style:normal;src:url(assets/fonts/Inter-Medium.otf) format('opentype')}
@font-face{font-family:'Inter';font-weight:600;font-style:normal;src:url(assets/fonts/Inter-SemiBold.otf) format('opentype')}
@font-face{font-family:'Carlito';font-weight:700;font-style:normal;src:url(assets/fonts/Carlito-Bold.ttf) format('truetype')}
:root{
  --bg:#08111F; --ink:#F8FAFC; --ink2:#CBD5E1; --ink3:#94A3B8; --ink4:#64748B;
  --accent:#1D4ED8; --accent-hi:#4D7CF5; --line:rgba(255,255,255,.10);
  --paper:#FFFFFF; --navy:#0F2A4A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05080F;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#viewport{position:relative;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--bg)}
.abs{position:absolute;left:0;top:0}
.scene{position:absolute;inset:0;display:none}
.frame{position:absolute;overflow:hidden;background:var(--paper);border-radius:10px;
  box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
.frame img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;image-rendering:auto}
.mask{position:absolute;overflow:hidden;white-space:nowrap}
.mask>.in{display:inline-block;will-change:transform}
.h1{font-weight:600;font-size:88px;letter-spacing:-.035em;line-height:1.08}
.h2{font-weight:600;font-size:64px;letter-spacing:-.03em;line-height:1.1}
.h3{font-weight:600;font-size:44px;letter-spacing:-.025em;line-height:1.15}
.lab{white-space:nowrap;font-weight:500;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.sub{font-weight:400;font-size:28px;letter-spacing:-.01em;color:var(--ink2)}
.cap{font-weight:500;font-size:22px;letter-spacing:-.005em;color:var(--ink)}
.acc{color:var(--accent-hi)}
.hl{position:absolute;border:3px solid var(--accent);border-radius:5px;background:rgba(29,78,216,.10);pointer-events:none}
.node{position:absolute;text-align:center;transform:translateX(-50%)}
.node .n{font-weight:600;font-size:30px;letter-spacing:-.02em}
.node .s{font-weight:500;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:10px}
.bar{position:absolute;height:2px;background:var(--accent-hi);transform-origin:0 50%}
.chip{position:absolute;padding:12px 18px;border-radius:8px;background:rgba(8,17,31,.86);border:1px solid var(--line);
  font-weight:500;font-size:22px;letter-spacing:-.005em;white-space:nowrap}
.chip b{font-weight:600;color:var(--accent-hi)}
.tag{position:absolute;right:48px;top:30px;font-size:15px;font-weight:500;letter-spacing:.06em;color:rgba(203,213,225,.62)}
.cursor{position:absolute;width:30px;height:30px;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.typed{position:absolute;font-family:Carlito,Calibri,Inter,sans-serif;font-weight:700;color:#0F172A;white-space:nowrap}
.caret{position:absolute;width:3px;background:#0F172A}
.cover{position:absolute;inset:0;background:#000;pointer-events:none}
/* preview chrome — not part of the film */
#ui{padding:20px 24px;max-width:1920px;font-size:14px;color:#CBD5E1}
#ui button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid #334155;background:#0F172A;color:#E2E8F0;cursor:pointer}
#ui input[type=range]{width:60%;vertical-align:middle}
#spec{padding:8px 24px 80px;max-width:1500px;color:#CBD5E1;font-size:14px;line-height:1.55}
#spec h2{color:#F8FAFC;font-size:22px;margin:34px 0 10px;letter-spacing:-.01em}
#spec table{border-collapse:collapse;width:100%}
#spec td,#spec th{border-bottom:1px solid #1E293B;padding:8px 10px;vertical-align:top;text-align:left}
#spec th{color:#94A3B8;font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#spec code{background:#0F172A;padding:1px 5px;border-radius:4px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid #334155}
body.render #ui,body.render #spec{display:none}
</style>

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;   // ease in-out cubic
const out = x => 1 - Math.pow(1 - x, 3);                                   // ease out cubic
const inn = x => x * x * x;
/* in/out envelope: 0 before a, ramps to 1 by a+d, holds, ramps down from b-d2 to b */
const env = (t, a, d, b, d2) => Math.min(out(P(t, a, a + d)), b === undefined ? 1 : 1 - inn(P(t, b - d2, b)));

/* ============================== seek ============================== */
function seek(t) {
  t = clamp(t, 0, DUR - 1e-6); let tag = 0;
  for (const s of scenes) {
    const on = t >= s.t0 && t < s.t1; s.root.style.display = on ? 'block' : 'none';
    if (on) { s.update(t); tag = Math.max(tag, s.tag(t)); }
  }
  TAG.style.opacity = tag;
  COVER.style.opacity = Math.max(1 - out(P(t, 0, .6)), inn(P(t, 47.3, 48)));
}
window.seek = seek;

/* decode every image before the first frame so seek(t) is always complete */
window.__ready = (async () => {
  await document.fonts.ready;
  // decode sequentially (parallel decode of many large images can fail in headless Chromium), with retry
  window.__imgs = {};
  for (const [k, s] of Object.entries(SC)) {
    for (let tries = 0; ; tries++) {
      const i = new Image(); i.src = s.src;
      try { await i.decode(); window.__imgs[k] = i; break; } catch (e) { if (tries > 4) throw e; await new Promise(r => setTimeout(r, 200)); }
    }
  }
  for (const i of VP.querySelectorAll('img')) { try { await i.decode(); } catch (e) {} }
  seek(0); return true;
})();

/* ============================== preview player + spec ============================== */
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
else {
  const wrap = document.getElementById('wrap');
  const fitVP = () => { const s = Math.min(1, (innerWidth - 0) / W); VP.style.transform = `scale(${s})`; wrap.style.height = H * s + 'px'; };
  addEventListener('resize', fitVP); fitVP();
  const aud = document.getElementById('aud'); if (ASSETS.audio) aud.src = ASSETS.audio;
  const sc = document.getElementById('scrub'), tc = document.getElementById('tc'), pb = document.getElementById('play');
  let playing = false, t0 = 0, p0 = 0;
  const label = t => `${t.toFixed(2)} s · bar ${Math.floor(t / BAR) + 1} beat ${Math.floor((t % BAR) / BEAT) + 1}`;
  const show = t => { seek(t); sc.value = t; tc.textContent = label(t); };
  sc.oninput = () => { playing = false; pb.textContent = 'Play'; aud.pause(); show(+sc.value); };
  pb.onclick = () => {
    playing = !playing; pb.textContent = playing ? 'Pause' : 'Play';
    if (playing) { p0 = +sc.value >= DUR - .05 ? 0 : +sc.value; t0 = performance.now(); if (ASSETS.audio) { aud.currentTime = p0; aud.play(); } }
    else aud.pause();
  };
  const loop = () => { if (playing) { let t = ASSETS.audio && !aud.paused ? aud.currentTime : p0 + (performance.now() - t0) / 1000;
      if (t >= DUR) { playing = false; pb.textContent = 'Play'; t = DUR - .001; } show(t); } requestAnimationFrame(loop); };
  window.__ready.then(() => { show(0); loop(); });
  renderSpec();
}
function renderSpec() {
  const m = STORY.meta, e = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const rows = STORY.shots.map(s => `<tr><td><b>${s.id}</b><br>${s.t0.toFixed(1)}–${s.t1.toFixed(1)} s<br>bars ${s.bars}<br>${e(s.beats)}</td>
    <td><b>${e(s.section)}</b><br>${e(s.visual)}</td><td>${e(s.source)}</td><td>${e(s.camera)}</td><td>${e(s.transition)}</td>
    <td>${s.text.map(e).join('<br>')}</td><td>${e(s.sound)}</td><td>${e(s.purpose)}</td></tr>`).join('');
  const sfx = STORY.sfx.map(x => `<tr><td>${x.t.toFixed(3)} s</td><td>${x.file}</td><td>${x.gain_db} dB</td><td>peak-aligned (offset from analysis.json)</td></tr>`).join('');
  document.getElementById('spec').innerHTML = `
  <h2>Production specification</h2>
  <p>${m.duration_s} s · ${m.resolution.join('×')} · ${m.fps} fps · ${m.bpm} BPM (1 bar = ${m.bar_s} s, 1 beat = ${m.beat_s} s) · 24 bars. Every cut sits on a downbeat or on beat 3.</p>
  <p><span class="sw" style="background:${m.background}"></span>Stage ${m.background} &nbsp; <span class="sw" style="background:${m.accent}"></span>Accent ${m.accent} (the primary series colour of the workbook's own charts) &nbsp; <span class="sw" style="background:${m.accent_on_dark}"></span>Accent tint on dark ${m.accent_on_dark} &nbsp; <span class="sw" style="background:#0F2A4A"></span>Workbook navy #0F2A4A (appears only inside screenshots)</p>
  <p>Typography: ${e(m.font)}. Headlines 88/64/44 px SemiBold, tracking −0.035 to −0.025 em; labels 18 px Medium, uppercase, +0.16 em. No full stops on screen. Masked reveals only (text rises into a clipping box, ease-out cubic, 0.4–0.5 s). No bounce, no glow, no shake, no particles.</p>
  <p>Music: ${e(m.music)} — ${e(m.music_offset_note)}. SFX are aligned by their measured peak, not their file start.</p>
  <h2>Storyboard</h2>
  <table><tr><th>Shot / time</th><th>Visual</th><th>Source asset</th><th>Camera</th><th>Transition</th><th>On-screen text</th><th>Sound</th><th>Purpose</th></tr>${rows}</table>
  <h2>SFX cue sheet</h2><table><tr><th>Time</th><th>File</th><th>Gain</th><th>Alignment</th></tr>${sfx}</table>
  <h2>Rendering</h2>
  <p>1 · <code>python3 tools/render_video.py</code> opens this file with <code>?render=1</code> in headless Chromium at 1920×1080, waits for <code>window.__ready</code>, calls <code>seek(i/60)</code> for every frame, screenshots, and pipes the frames into ffmpeg (H.264, yuv420p). Optional <code>--sub 3</code> renders temporal sub-frames at t−1/240, t, t+1/240 and averages them (motion blur).</p>
  <p>2 · <code>python3 tools/mix_audio.py</code> trims the music to the measured first downbeat, places each SFX by its measured peak, and loudness-normalises to −14 LUFS / −1 dBTP.</p>
  <p>3 · ffmpeg muxes video + mix into <code>output/mes_case_study_48s.mp4</code>. See video/README.md for exact commands.</p>`;
}
